[project]
name = "ai-data-copilot"
version = "0.1.0"
description = "Read-only MySQL discovery foundation for an AI data copilot"
requires-python = ">=3.12"
dependencies = [
  "pydantic-settings>=2.6,<3",
  "SQLAlchemy>=2.0,<3",
  "PyMySQL>=1.1,<2",
  "sqlglot>=26,<27",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "openai>=1.60,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
  "mypy>=1.13,<2",
]

[project.scripts]
inspect-mysql = "app.db.inspect:main"
validate-relationships = "app.db.validate_relationships:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
